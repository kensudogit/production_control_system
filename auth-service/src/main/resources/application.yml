spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:docker}
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/production_control}
    username: ${SPRING_DATASOURCE_USERNAME:production_user}
    password: ${SPRING_DATASOURCE_PASSWORD:production_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:redis_password}

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-environment-please-use-a-secure-random-key}
  expiration: ${JWT_EXPIRATION:86400000} # 24時間
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7日

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.production.control: DEBUG

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/production_control
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
  logging:
    level:
      root: WARN
      com.production.control: INFO
